name: Build APK

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk fake_calling.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fake_calling
          path: fake_calling.apk
          if-no-files-found: error
          retention-days: 14
