name: fake_calling
description: "Fake Calling: Prank & Escape — schedule realistic fake incoming calls."
publish_to: 'none' 

version: 1.0.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^3.0.0
  flutter_callkit_incoming: ^3.1.6
  uuid: ^4.6.0
  flutter_bloc: ^9.1.1
  camera: ^0.12.1
  go_router: ^18.0.2
  get_it: ^9.3.0
  camera_platform_interface: ^2.15.0
  video_player_platform_interface: ^6.9.0
  video_player: ^2.14.1
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.3.2
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  showcaseview: ^5.1.0
  clock: ^1.1.3
  in_app_update_flutter: ^3.0.1

dependency_overrides:
  flutter_callkit_incoming:
    path: packages/flutter_callkit_incoming

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true


  uses-material-design: true

  assets:
    - assets/videos/
    - assets/img/launcher/launcher_icon.png
    - assets/img/elumi.png

flutter_launcher_icons:
  image_path: "assets/img/launcher/launcher_icon.png"
  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "#B3CBFC"
  adaptive_icon_foreground: "assets/img/launcher/launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#B3CBFC"

flutter_native_splash:
  color: "#B3CBFC"
  image: assets/img/launcher/splash_logo.png
  android_12:
    color: "#B3CBFC"
    image: assets/img/launcher/splash_android12.png
  fullscreen: false
